<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Manual do Recruta</title>
  <link rel="stylesheet" href="login.css">

  <style>
    .mensagem {
      margin-top: 15px;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 600;
      text-align: center;
      font-size: 0.95rem;
    }

    .mensagem.erro {
      color: #b00020 !important;
      background-color: #ffe5e5;
      border: 2px solid #e53935;
      box-shadow: 0 4px 12px rgba(229, 57, 53, 0.25);
    }

    .mensagem.sucesso {
      color: #087f23 !important;
      background-color: #e4f8e8;
      border: 2px solid #22a447;
      box-shadow: 0 4px 12px rgba(34, 164, 71, 0.25);
    }

    footer {
      text-align: center;
      padding: 15px 20px;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="left">
      <div class="overlay">
        <img src="lucaa.png" alt="Logo Arara Azul" class="logo">
        <h1>Manual do Recruta</h1>
        <p>O seu primeiro passo rumo ao sucesso profissional.</p>
      </div>
    </div>

    <div class="right">
      <div class="login-box">
        <h2>Bem-vindo de volta!</h2>
        <p>Entre na sua conta e continue sua jornada.</p>

        <form id="loginForm">

          <div class="input-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
          </div>

          <div class="input-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required>
          </div>

          <button type="submit" class="btn-login">Entrar</button>

        </form>

        <p class="cadastro-texto">
          Ainda não tem uma conta?
          <a href="cadastro.html">Crie a sua agora</a>
        </p>

        <p id="mensagem" class="mensagem"></p>

      </div>

      <footer>
        &copy; 2025 Manual do Recruta. Todos os direitos reservados.
      </footer>

    </div>

  </div>

  <script src="login.js"></script>

</body>
</html>
